# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file, and
# `prism-code build` writes it; `prism-code check` refuses one that is not that
# generation byte for byte (R1).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and proved by Lean's kernel
#   open       measured and reported, never asserted
#
# Every row has a scenario in `features/suites/`, tagged with its ID and level
# (R3). A `build` row names its evidence in `theorems`: each a theorem of the
# model in `app/src/`, written `Module.name`. `prism-code check` refuses the row
# unless every theorem it names is stated by the model and proved by Lean's
# kernel, within its declared axioms, in that same check. There is no "pending"
# state: a capability that is not built does not get a row.
#
# A row that specifies a public failure declares it (R5):
#
#   failure   the exact response the application gives when it refuses, as text
#   negative  the ID of the `build` row whose theorems prove the refusal's
#             condition; this row's own ID when the row is that claim
#
# Its scenario is also tagged `@rejects`, and `prism-code build` refuses the row
# unless it replays at least one acceptance vector whose response is exactly the
# `failure` text.
#
# A capability starts with a row here, then its scenario, then the theorem and
# the acceptance vectors that are its evidence, in the order `AGENTS.md` sets out.

spec = "template/2"

[[id]]
id = "HP-01"
level = "build"
suite = "app"
statement = "A lossless representation outranks a lossy one, a deeper lossless one outranks a shallower one, a higher bitrate outranks a lower one, and the order is antisymmetric and ties only equal scores"
theorems = ["App.lossless_outranks_lossy", "App.deeper_lossless_wins", "App.higher_bitrate_wins", "App.rank_is_antisymmetric", "App.rank_ties_only_equal_scores"]

[[id]]
id = "HP-02"
level = "build"
suite = "app"
statement = "After a representation fails the player advances only to one that remains, and stops once every one was tried"
theorems = ["App.retry_stays_in_range", "App.retry_ends"]

[[id]]
id = "HP-03"
level = "build"
suite = "app"
statement = "An item reaches the audio engine exactly when its bytes are readable and enhancement is on; an unreadable item never does"
theorems = ["App.unreadable_never_reaches_engine", "App.readable_enhanced_reaches_engine"]

[[id]]
id = "HP-04"
level = "build"
suite = "app"
statement = "Next, previous and remove keep the playing index inside the queue; next stops at the end without repeat; previous restarts after three seconds"
theorems = ["App.ahead_stays_in_queue", "App.ahead_stops_at_the_end", "App.prior_stays_in_queue", "App.prior_restarts_after_three_seconds", "App.strip_stays_in_queue"]

[[id]]
id = "HP-05"
level = "build"
suite = "app"
statement = "A pasted link is classed as a track, a stream, an album, a companion stream, a companion import or external; an audio file on any other host is a track"
theorems = ["App.audio_file_is_a_track", "App.companion_link_needs_the_companion"]

[[id]]
id = "HP-06"
level = "build"
suite = "app"
statement = "A saved position is resumed only when it lies at least thirty seconds inside the item; within thirty seconds of the end the item is finished"
theorems = ["App.resume_stays_inside_the_item", "App.near_the_end_is_finished"]

[[id]]
id = "HP-07"
level = "build"
suite = "app"
statement = "A direct source is always offered; a companion source is offered only when the host reports the companion"
theorems = ["App.companion_source_needs_the_companion", "App.direct_source_is_always_offered"]

[[id]]
id = "HP-09"
level = "build"
suite = "app"
statement = "A catalogue song plays from the companion when it is present, else from an open full-length source, else as a preview; a preview is never chosen while a full-length source exists"
theorems = ["App.full_source_beats_preview", "App.preview_needs_a_preview", "App.companion_pick_needs_the_companion", "App.something_plays_when_anything_can"]

[[id]]
id = "HP-08"
level = "build"
suite = "app"
statement = "A request is accepted only at one of the four lengths a request has; any other request is answered invalid request"
theorems = ["App.accepts_exactly_a_request"]
failure = "invalid request"
negative = "HP-08"
